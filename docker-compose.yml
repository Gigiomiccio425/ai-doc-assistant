# ══════════════════════════════════════════════════════════════════════════════
# Assistente AI Locale per Documenti - con container Ollama incluso.
#
# Nessuna variabile ${...}: il parser dell'App Store di ZimaOS/CasaOS non
# supporta l'interpolazione con default e rifiuta il file. I valori sono
# letterali: modificali direttamente qui sotto se i tuoi percorsi differiscono.
#
# Da modificare, se serve:
#   - riga volumes di app:  /DATA/Documents  -> la cartella da indicizzare
#   - riga ports di app:    8088             -> la porta della Web UI
#   - LLM_MODEL / EMBED_MODEL                -> i modelli da usare
#
# Se hai gia' Ollama installato usa docker-compose.external-ollama.yml.
# ══════════════════════════════════════════════════════════════════════════════

name: ai-doc-assistant

services:
  # ── App principale: Web UI + API RAG ─────────────────────────────────────
  app:
    # Versione pinnata: un riavvio del NAS non deve mai tirare giu' una build
    # nuova a sorpresa. Per aggiornare, cambia il tag e fai docker compose pull.
    image: ghcr.io/gigiomiccio425/ai-doc-assistant:1.0.1
    container_name: ai-doc-assistant
    restart: unless-stopped
    ports:
      - "8088:8000"
    environment:
      OLLAMA_URL: "http://ollama:11434"
      LLM_MODEL: "llama3.2"
      EMBED_MODEL: "nomic-embed-text"
      SCAN_ON_START: "true"
      DATA_DIR: /data
      DOCS_DIR: /documents
      TZ: "Europe/Rome"
    volumes:
      # Cartella del NAS da indicizzare. :ro = l'app non puo' toccare i tuoi file.
      - /DATA/Documents:/documents:ro
      # Persistenza: ChromaDB, anagrafica SQLite, impostazioni, file caricati.
      - /DATA/AppData/ai-doc-assistant/data:/data
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ai-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    x-casaos:
      envs:
        - container: OLLAMA_URL
          description:
            en_us: "Ollama endpoint. Use http://ollama:11434 for the bundled container."
            it_it: "Endpoint di Ollama. Usa http://ollama:11434 per il container incluso."
        - container: LLM_MODEL
          description:
            en_us: "Chat model (llama3.2, mistral, phi3, qwen2.5 ...)"
            it_it: "Modello per le risposte (llama3.2, mistral, phi3, qwen2.5 ...)"
        - container: EMBED_MODEL
          description:
            en_us: "Embedding model (nomic-embed-text, bge-m3)"
            it_it: "Modello di embedding (nomic-embed-text, bge-m3)"
        - container: SCAN_ON_START
          description:
            en_us: "Scan the documents folder at startup"
            it_it: "Scansiona la cartella documenti all'avvio"
      ports:
        - container: "8000"
          description:
            en_us: "Web UI / API port"
            it_it: "Porta della Web UI e delle API"
      volumes:
        - container: /documents
          description:
            en_us: "NAS folder to index (read-only)"
            it_it: "Cartella del NAS da indicizzare (sola lettura)"
        - container: /data
          description:
            en_us: "Vector DB, registry and uploaded files"
            it_it: "Vector DB, anagrafica e file caricati"

  # ── Motore LLM ────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ai-doc-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "15m"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - /DATA/AppData/ai-doc-assistant/ollama:/root/.ollama
    networks:
      - ai-net
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    # --- GPU NVIDIA: scommentare se disponibile sul tuo Zima -----------------
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

    x-casaos:
      ports:
        - container: "11434"
          description:
            en_us: "Ollama API port"
            it_it: "Porta API di Ollama"
      volumes:
        - container: /root/.ollama
          description:
            en_us: "Downloaded models"
            it_it: "Modelli scaricati"

  # ── Scarica i modelli al primo avvio, poi esce. Non riparte da solo. ──────
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ai-doc-ollama-pull
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull llama3.2 && ollama pull nomic-embed-text"]
    networks:
      - ai-net

networks:
  ai-net:
    driver: bridge

# ══════════════════════════════════════════════════════════════════════════════
# Metadati Zima OS / CasaOS: icona, titolo, categoria e link nella dashboard.
# ══════════════════════════════════════════════════════════════════════════════
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  author: self
  developer: self
  category: AI
  hostname: ""
  icon: https://raw.githubusercontent.com/selfhst/icons/main/png/ollama.png
  thumbnail: ""
  screenshot_link: []
  title:
    en_us: AI Document Assistant
    it_it: Assistente AI Documenti
  tagline:
    en_us: Ask questions to your own documents, fully offline
    it_it: Fai domande ai tuoi documenti, tutto in locale
  description:
    en_us: >-
      Private RAG assistant for your NAS. Indexes PDF, DOCX, TXT and Markdown
      files with ChromaDB and answers in natural language through a local Ollama
      model, always citing the source document and page. No data ever leaves
      your device.
    it_it: >-
      Assistente RAG privato per il tuo NAS. Indicizza PDF, DOCX, TXT e Markdown
      con ChromaDB e risponde in linguaggio naturale tramite un modello Ollama
      locale, citando sempre documento e pagina di origine. Nessun dato lascia
      il dispositivo.
  index: /
  port_map: "8088"
  scheme: http
  tips:
    before_install:
      en_us: >-
        The documents folder defaults to /DATA/Documents. The first startup
        downloads the models: it may take several minutes.
      it_it: >-
        La cartella dei documenti e' /DATA/Documents. Al primo avvio vengono
        scaricati i modelli: puo' richiedere diversi minuti.
